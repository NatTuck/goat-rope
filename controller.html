<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Goat Rope Controller</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a3d15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    #app { display: contents; }
    .connecting {
      color: #8fbc5f;
    }
    .goat-name {
      background: var(--goat-color, #e74c3c);
      padding: 15px 30px;
      border-radius: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: #3a6a3a;
      box-shadow: 0 4px 0 #1a3d15;
      transform: none;
      transition: all 0.1s;
      touch-action: manipulation;
      font-size: 24px;
      color: #fff;
    }
    .btn.active {
      background: var(--goat-color, #e74c3c);
      box-shadow: 0 0 20px var(--goat-color, #e74c3c);
      transform: translateY(4px);
    }
    .rope-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      background: #5a3a1a;
      box-shadow: 0 6px 0 #2a1a0a;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      margin-top: 20px;
      touch-action: manipulation;
    }
    .rope-btn.active {
      background: #8b4513;
      box-shadow: 0 0 30px #8b4513;
      transform: translateY(6px);
    }
    .hint {
      color: #6a9c4f;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="app">Connecting...</div>
  <script type="module" src="/src/client/controller.jsx"></script>
</body>
</html>
